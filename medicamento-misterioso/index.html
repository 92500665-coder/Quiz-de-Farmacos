 options.forEach((text,i)=>{const b=document.createElement("button");b.className="option";b.type="button";b.setAttribute("aria-pressed","false");b.textContent=`${String.fromCharCode(65+i)}. ${text}`;b.onclick=()=>{if(answered)return;choice=i;$("check").disabled=false;[...list.children].forEach((x,n)=>x.setAttribute("aria-pressed",String(n===i)))};list.append(b)});
}
function check(){
 if(choice===null||answered)return;answered=true;const d=data[order[index]];
 [...$("options").children].forEach((b,i)=>{b.disabled=true;if(i===correctChoice)b.classList.add("correct");if(i===choice&&i!==correctChoice)b.classList.add("wrong")});
 const isCorrect=choice===correctChoice;
 if(isCorrect){score++;$("result").textContent="✅ ¡Correcto!";$("result").style.color="#237a3b"}else{$("result").textContent=`❌ Incorrecto. Respuesta: ${String.fromCharCode(65+correctChoice)}.`;$("result").style.color="#b42318"}
 $("reactionCat").innerHTML=`<path d="M15 35 12 13l19 13a30 30 0 0 1 18 0l19-13-3 23c8 8 7 20-1 27-6 6-14 9-24 9s-18-3-24-9c-8-7-9-19-1-28Z" fill="#fff4e8" stroke="#568c61" stroke-width="3" stroke-linejoin="round"/><path d="M25 21Q40 6 55 21l-2 8a36 36 0 0 0-26 0Z" fill="#fff" stroke="#568c61" stroke-width="3"/><path d="M40 12v11m-5-5h10" stroke="#568c61" stroke-width="3" stroke-linecap="round"/><path d="${isCorrect?"M26 42q4-8 8 0m12 0q4-8 8 0":"M27 40h.5m19-.5h.5M25 34l9 3m12 0 9-3"}" fill="none" stroke="#302833" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="22" cy="51" rx="5" ry="3" fill="#f4b4af"/><ellipse cx="58" cy="51" rx="5" ry="3" fill="#f4b4af"/><path d="m37 49 3 3 3-3Z" fill="#e58a8a" stroke="#302833" stroke-width="1.2"/><path d="${isCorrect?"M32 54q8 12 16 0":"M32 62q8-12 16 0"}" fill="none" stroke="#302833" stroke-width="2.5" stroke-linecap="round"/><path d="M24 69q16-10 32 0v12H24Z" fill="#d5ead8" stroke="#568c61" stroke-width="3"/><path d="M40 70v10m-4-5h8" stroke="#568c61" stroke-width="2.5" stroke-linecap="round"/>`;
 $("reactionCat").setAttribute("role","img");
 $("reactionCat").setAttribute("aria-label",isCorrect?"Gatito enfermero feliz":"Gatito enfermero animándote");
 $("reactionText").textContent=isCorrect?"¡Correcto! ¡El gatito está feliz!":"¡Suerte para la próxima! El gatito te anima.";
 $("reaction").hidden=false;
 $("score").textContent=`Aciertos: ${score}`;$("explanation").textContent=d.e;$("check").hidden=true;$("next").hidden=false;$("next").focus();
}
function next(){index++;if(index<30){show();$("questionTitle").focus();return}
 $("quiz").hidden=true;$("finish").hidden=false;
 const colors=["#e76f51","#f4a261","#e9c46a","#58a66b","#5aa9e6","#b783d2","#f284b6"];
 const card=document.createElement("div");card.className="finish-card";
 const confetti=document.createElement("div");confetti.className="confetti";confetti.setAttribute("aria-hidden","true");
 for(let i=0;i<36;i++){const piece=document.createElement("span");piece.className="confetti-piece";piece.style.left=`${(i*37)%100}%`;piece.style.setProperty("--piece-color",colors[i%colors.length]);piece.style.setProperty("--fall-delay",`${(i%12)*0.14}s`);piece.style.setProperty("--fall-duration",`${2.6+(i%5)*0.3}s`);piece.style.setProperty("--drift",`${((i*31)%120)-60}px`);piece.style.setProperty("--resting-top",`${(i*23)%88}%`);confetti.appendChild(piece)}
 const content=document.createElement("div");content.className="finish-content";
 const cat=document.createElement("div");cat.className="finish-cat";cat.innerHTML='<svg viewBox="0 0 180 180" role="img" aria-label="Gatito enfermero sonriendo y haciendo pulgar arriba"><path d="M37 74 31 37l34 21a53 53 0 0 1 36 0l34-21-6 39c13 14 12 35-1 48-11 11-27 17-48 17s-37-6-48-17c-13-13-14-34-1-50Z" fill="#fff4e8" stroke="#568c61" stroke-width="5" stroke-linejoin="round"/><path d="M55 49q35-35 70 0l-4 14a78 78 0 0 0-62 0Z" fill="#fff" stroke="#568c61" stroke-width="5"/><path d="M90 32v20m-10-10h20" stroke="#568c61" stroke-width="5" stroke-linecap="round"/><path d="M58 84q8-14 16 0m32 0q8-14 16 0" fill="none" stroke="#302833" stroke-width="5" stroke-linecap="round"/><ellipse cx="48" cy="101" rx="9" ry="6" fill="#f4b4af"/><ellipse cx="132" cy="101" rx="9" ry="6" fill="#f4b4af"/><path d="m84 96 6 6 6-6Z" fill="#e58a8a" stroke="#302833" stroke-width="2"/><path d="M76 108q14 18 28 0" fill="none" stroke="#302833" stroke-width="4" stroke-linecap="round"/><path d="M48 139q42-27 84 0v30H48Z" fill="#d5ead8" stroke="#568c61" stroke-width="5"/><path d="M90 143v20m-9-10h18" stroke="#568c61" stroke-width="4" stroke-linecap="round"/><path d="M125 148h39v20h-39Z" fill="#f3d9bd" stroke="#568c61" stroke-width="4" stroke-linejoin="round"/><path d="M131 149v-30q0-15 12-15t12 15v20q0-11 9-11t10 10v17q0 12-12 12h-23" fill="#fff4e8" stroke="#568c61" stroke-width="4" stroke-linejoin="round"/></svg>';
 const title=document.createElement("h2");title.className="finish-title";title.textContent="🎉 ¡FELICIDADES, TERMINASTE EL RETO! 🎉";
 const result=document.createElement("p");result.className="finish-score";result.textContent=`Puntuación: ${score} / ${data.length} (${Math.round(score/data.length*100)}%)`;
 const message=document.createElement("p");message.className="finish-message";message.textContent="¡El gatito enfermero está orgulloso de ti! Sigue aprendiendo y cuidando con cariño. 💚";
 const again=document.createElement("button");again.className="action finish-restart";again.textContent="Jugar de nuevo";again.onclick=start;
 content.append(cat,title,result,message,again);card.append(confetti,content);$("finish").replaceChildren(card);again.focus();
}
function start(){order=shuffle([...data.keys()]);positionSchedule=shuffle(Array.from({length:30},(_,i)=>i%4));index=0;score=0;$("quiz").hidden=false;$("finish").hidden=true;show()}
function playNote(){
 if(!audioContext||audioContext.state!=="running")return;
 const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();
 const now=audioContext.currentTime;
 oscillator.type="sine";oscillator.frequency.value=melody[noteIndex++%melody.length];
 gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(0.14,now+0.04);gain.gain.exponentialRampToValueAtTime(0.0001,now+0.34);
 oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(now);oscillator.stop(now+0.36);
}
function toggleMusic(){
 if(musicTimer){clearInterval(musicTimer);musicTimer=null;$("music").textContent="🎵 Activar música";$("music").setAttribute("aria-pressed","false");$("musicStatus").textContent="Música pausada.";return}
 const AudioContextClass=window.AudioContext||window.webkitAudioContext;
 if(!AudioContextClass){$("musicStatus").textContent="Este navegador no admite reproducción de música.";return}
 audioContext=audioContext||new AudioContextClass();
 audioContext.resume().then(()=>{playNote();musicTimer=setInterval(playNote,420);$("music").textContent="🔇 Pausar música";$("music").setAttribute("aria-pressed","true");$("musicStatus").textContent="Música activada."}).catch(()=>{$("musicStatus").textContent="No se pudo iniciar el audio. Revisa los permisos del navegador."});
}
$("check").onclick=check;$("next").onclick=next;
$("music").onclick=toggleMusic;
start();
